# Kubernetes Orchestration Manifests (NIST SP 800-207 Workload Isolation)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-machine-customer
  namespace: machine-customer-system
  labels:
    app.kubernetes.io/name: zero-trust-machine-customer
    app.kubernetes.io/component: machine-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zero-trust-machine-customer
  template:
    metadata:
      labels:
        app: zero-trust-machine-customer
    spec:
      serviceAccountName: machine-customer-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        # Core Machine Customer Workload Container
        - name: machine-customer-agent
          image: ghcr.io/vfcarida/zero-trust-machine-customer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: OPA_SERVER_URL
              value: "http://127.0.0.1:8181/v1/data/machine_customer/authz"
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/spire/sockets/agent.sock"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health?probe=liveness
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health?probe=readiness
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

        # Sidecar 1: Open Policy Agent (OPA) Policy Enforcement Engine
        - name: opa-sidecar
          image: openpolicyagent/opa:latest-envoy
          args:
            - "run"
            - "--server"
            - "--addr=127.0.0.1:8181"
            - "/policies"
          volumeMounts:
            - name: opa-policy-volume
              mountPath: /policies
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health?bundle=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

        # Sidecar 2: SPIRE Agent Workload Attestation Sidecar (SPIFFE X.509 SVID)
        - name: spire-agent-sidecar
          image: ghcr.io/spiffe/spire-agent:1.8.0
          args:
            - "-config"
            - "/opt/spire/conf/agent/agent.conf"
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets

      volumes:
        - name: spire-agent-socket
          emptyDir: {}
        - name: opa-policy-volume
          configMap:
            name: opa-rego-policy-cm

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-rego-policy-cm
  namespace: machine-customer-system
data:
  machine_customer.rego: |
    package machine_customer.authz
    import future.keywords.in

    default allow = false

    default_allowlisted_merchants = [
        "aws_compute",
        "partssource_corp",
        "google_cloud_m2m",
        "mcmaster_carr"
    ]

    allow {
        input.action == "execute_transaction"
        merchant_is_allowlisted
        spend_within_daily_limit
        payload_is_not_tainted
    }

    merchant_is_allowlisted {
        input.guardSettings.allowlist
        count(input.guardSettings.allowlist) > 0
        input.transaction.merchantId in input.guardSettings.allowlist
    }

    merchant_is_allowlisted {
        not input.guardSettings.allowlist
        input.transaction.merchantId in default_allowlisted_merchants
    }

    spend_within_daily_limit {
        projected_spend := input.currentDailySpendUcents + input.transaction.amountUcents
        projected_spend <= input.guardSettings.dailySpendLimitUcents
    }

    payload_is_not_tainted {
        input.taintStatus != "TAINTED"
    }

    deny_reason["UNAUTHORIZED_MERCHANT"] {
        input.action == "execute_transaction"
        not merchant_is_allowlisted
    }

    deny_reason["DAILY_LIMIT_EXCEEDED"] {
        input.action == "execute_transaction"
        not spend_within_daily_limit
    }

    deny_reason["TAINTED_PAYLOAD_HITL_REQUIRED"] {
        input.action == "execute_transaction"
        not payload_is_not_tainted
    }

---
apiVersion: v1
kind: Service
metadata:
  name: zero-trust-machine-customer
  namespace: machine-customer-system
  labels:
    app.kubernetes.io/name: zero-trust-machine-customer
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: zero-trust-machine-customer

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: machine-customer-sa
  namespace: machine-customer-system

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: machine-customer-egress-only
  namespace: machine-customer-system
spec:
  podSelector:
    matchLabels:
      app: zero-trust-machine-customer
  policyTypes:
    - Ingress
    - Egress
  ingress: [] # Block all inbound ingress traffic (Dark Host architecture)
  egress:
    # Allow DNS resolution (CoreDNS / cluster DNS)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound TLS traffic to authorized endpoints
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
